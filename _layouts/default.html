<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% else %}<meta name="description" content="{{ site.description | escape }}">{% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      </header>
      <main id="contenido">
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>{{ site.title | escape }}</span>
      </footer>
    </div>
  </body>
</html>
